name: CI

on:
  push:
    branches: [development, main, 'Sprint-*', 'sprint-*']
  pull_request:
    branches: ['Sprint-*', 'sprint-*', development, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    name: Tests and PHP lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      # The API tests start `php -S` and the API calls Supabase through curl,
      # so pin PHP and its extensions instead of relying on the runner image.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: curl, json
          coverage: none
      - name: Install dependencies
        run: npm ci
      - name: Automated tests
        run: npm test
      - name: JavaScript syntax check
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(git ls-files -z -- '*.js')
      - name: PHP syntax check (all tracked PHP files)
        shell: bash
        run: |
          set -euo pipefail
          php --version
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(git ls-files -z -- '*.php')

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  secrets:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Gitleaks reads the pull request's commits before scanning them.
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_VERSION: '8.30.1'
